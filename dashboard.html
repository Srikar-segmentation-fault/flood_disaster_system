<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FloodSense AI - Analytics Dashboards</title>
  <meta name="description" content="FloodSense AI analytics dashboards with historical flood analysis, storm tracking, and real-time risk visualization."/>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg-base:#060a14;--bg-panel:#0b1120;--bg-card:#101828;--bg-card2:#152035;
      --border:rgba(99,179,237,0.12);--border-glow:rgba(99,179,237,0.35);
      --text-primary:#e8f0fe;--text-secondary:#8ba3c7;--text-muted:#4a6080;
      --accent-blue:#3b82f6;--accent-cyan:#06b6d4;--accent-violet:#8b5cf6;
      --risk-low:#22c55e;--risk-mod:#eab308;--risk-high:#f97316;--risk-crit:#ef4444;
      --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;--radius:14px;
    }
    html,body{height:100%;}
    body{font-family:var(--font);background:var(--bg-base);color:var(--text-primary);overflow-x:hidden;min-height:100vh;}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
    #app{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;}
    .topnav{height:60px;background:rgba(11,17,32,0.92);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;}
    .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
    .nav-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#1d4ed8,#06b6d4);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;}
    .nav-logo-text{font-size:16px;font-weight:700;color:#60a5fa;letter-spacing:-0.3px;}
    .nav-logo-sub{font-size:10px;color:var(--text-muted);margin-top:-2px;}
    .nav-divider{width:1px;height:28px;background:var(--border);}
    .nav-tabs{display:flex;gap:4px;}
    .nav-tab{display:flex;align-items:center;gap:7px;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all 0.22s;color:var(--text-muted);background:none;}
    .nav-tab:hover{color:var(--text-primary);background:rgba(255,255,255,0.04);}
    .nav-tab.active{color:#60a5fa;background:rgba(59,130,246,0.12);border-color:rgba(59,130,246,0.3);}
    .nav-tab.flood.active{color:#38bdf8;background:rgba(56,189,248,0.1);border-color:rgba(56,189,248,0.3);}
    .nav-tab.storm.active{color:#c084fc;background:rgba(168,85,247,0.1);border-color:rgba(168,85,247,0.3);}
    .nav-tab.globe{text-decoration:none;}
    .nav-tab.globe:hover{color:#06b6d4;background:rgba(6,182,212,0.08);border-color:rgba(6,182,212,0.2);}
    .nav-spacer{flex:1;}
    .nav-status{display:flex;align-items:center;gap:6px;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:600;color:#22c55e;}
    .status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px #22c55e;animation:blink 2s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:0.35}}
    .nav-back-link{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:11px;font-weight:600;color:var(--text-muted);background:rgba(255,255,255,0.03);border:1px solid var(--border);cursor:pointer;text-decoration:none;transition:all 0.2s;}
    .nav-back-link:hover{color:var(--text-primary);border-color:var(--border-glow);}
    .page-content{flex:1;padding:28px 28px 40px;max-width:1600px;margin:0 auto;width:100%;}
    .page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;}
    .page-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:8px;}
    .page-badge.flood{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.3);color:#38bdf8;}
    .page-badge.storm{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.3);color:#c084fc;}
    .page-badge.overview{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);color:#60a5fa;}
    .page-title{font-size:26px;font-weight:800;letter-spacing:-0.5px;line-height:1.2;}
    .hl-flood{color:#38bdf8;}.hl-storm{color:#c084fc;}.hl-default{color:#60a5fa;}
    .page-subtitle{font-size:13px;color:var(--text-secondary);margin-top:5px;}
    .page-header-actions{display:flex;gap:8px;align-items:center;padding-top:4px;}
    .action-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text-secondary);transition:all 0.2s;text-decoration:none;}
    .action-btn:hover{border-color:var(--border-glow);color:var(--text-primary);background:rgba(255,255,255,0.06);}
    .action-btn.primary{background:rgba(59,130,246,0.15);border-color:rgba(59,130,246,0.4);color:#60a5fa;}
    .action-btn.primary:hover{background:rgba(59,130,246,0.25);}
    .stat-row{display:grid;gap:16px;margin-bottom:24px;}
    .stat-row.cols-4{grid-template-columns:repeat(4,1fr);}
    .stat-row.cols-5{grid-template-columns:repeat(5,1fr);}
    .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;transition:border-color 0.2s,transform 0.2s;}
    .stat-card:hover{border-color:var(--border-glow);transform:translateY(-2px);}
    .stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--radius) var(--radius) 0 0;}
    .stat-card.blue::after{background:linear-gradient(90deg,#3b82f6,#06b6d4);}
    .stat-card.cyan::after{background:linear-gradient(90deg,#06b6d4,#14b8a6);}
    .stat-card.violet::after{background:linear-gradient(90deg,#8b5cf6,#a855f7);}
    .stat-card.orange::after{background:linear-gradient(90deg,#f97316,#ef4444);}
    .stat-card.green::after{background:linear-gradient(90deg,#22c55e,#14b8a6);}
    .stat-card.red::after{background:linear-gradient(90deg,#ef4444,#f97316);}
    .stat-card.yellow::after{background:linear-gradient(90deg,#eab308,#f97316);}
    .stat-label{font-size:10px;font-weight:600;letter-spacing:0.9px;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
    .stat-value{font-size:28px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;line-height:1;}
    .stat-sub{font-size:11px;color:var(--text-secondary);margin-top:5px;display:flex;align-items:center;gap:5px;}
    .stat-trend{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;font-family:var(--mono);}
    .stat-trend.up{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.2);}
    .stat-trend.down{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.2);}
    .stat-trend.neutral{background:rgba(234,179,8,0.12);color:#fde047;border:1px solid rgba(234,179,8,0.2);}
    .stat-icon{position:absolute;top:14px;right:16px;font-size:22px;opacity:0.25;}
    .chart-grid{display:grid;gap:20px;margin-bottom:24px;}
    .chart-grid.cols-2{grid-template-columns:1fr 1fr;}
    .chart-grid.cols-2-1{grid-template-columns:2fr 1fr;}
    .chart-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;transition:border-color 0.2s;}
    .chart-card:hover{border-color:var(--border-glow);}
    .chart-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;}
    .chart-title{font-size:13px;font-weight:700;color:var(--text-primary);}
    .chart-subtitle{font-size:11px;color:var(--text-muted);margin-top:3px;}
    .chart-pill{font-size:10px;font-weight:600;padding:3px 9px;border-radius:12px;font-family:var(--mono);}
    .chart-pill.flood{background:rgba(56,189,248,0.1);border:1px solid rgba(56,189,248,0.25);color:#38bdf8;}
    .chart-pill.storm{background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.25);color:#c084fc;}
    .chart-pill.green{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);color:#4ade80;}
    .chart-pill.orange{background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.25);color:#fb923c;}
    .chart-pill.red{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#f87171;}
    .chart-body{flex:1;position:relative;min-height:220px;}
    .chart-body canvas{width:100%!important;}
    .legend-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);}
    .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .legend-line{width:14px;height:3px;border-radius:2px;flex-shrink:0;}
    .event-table-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px;}
    .event-table-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .event-table-header h3{font-size:13px;font-weight:700;}
    .event-table-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}
    table.dash-table{width:100%;border-collapse:collapse;}
    table.dash-table thead th{padding:10px 16px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-muted);background:rgba(255,255,255,0.02);text-align:left;border-bottom:1px solid var(--border);}
    table.dash-table tbody tr{border-bottom:1px solid rgba(99,179,237,0.06);transition:background 0.15s;}
    table.dash-table tbody tr:hover{background:rgba(99,179,237,0.03);}
    table.dash-table tbody tr:last-child{border-bottom:none;}
    table.dash-table tbody td{padding:10px 16px;font-size:11px;color:var(--text-secondary);vertical-align:middle;}
    .td-name{font-weight:600;color:var(--text-primary)!important;}
    .risk-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.5px;display:inline-block;}
    .risk-badge.low{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.2);}
    .risk-badge.moderate{background:rgba(234,179,8,0.12);color:#fde047;border:1px solid rgba(234,179,8,0.2);}
    .risk-badge.high{background:rgba(249,115,22,0.12);color:#fb923c;border:1px solid rgba(249,115,22,0.2);}
    .risk-badge.critical{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.2);}
    .risk-badge.extreme{background:rgba(168,85,247,0.12);color:#c084fc;border:1px solid rgba(168,85,247,0.2);}
    .mini-bar{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;min-width:80px;}
    .mini-bar-fill{height:100%;border-radius:3px;}
    .feature-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .feature-name{font-size:11px;color:var(--text-secondary);width:160px;flex-shrink:0;}
    .feature-bar-bg{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;}
    .feature-bar-fill{height:100%;border-radius:4px;}
    .feature-pct{font-size:10px;font-family:var(--mono);color:var(--text-muted);width:38px;text-align:right;flex-shrink:0;}
    .alert-feed{display:flex;flex-direction:column;gap:8px;}
    .alert-item{background:var(--bg-card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;animation:fadeInUp 0.4s ease;}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .alert-icon{font-size:18px;flex-shrink:0;margin-top:1px;}
    .alert-body{flex:1;}
    .alert-title{font-size:12px;font-weight:600;margin-bottom:2px;}
    .alert-desc{font-size:11px;color:var(--text-secondary);line-height:1.45;}
    .alert-meta{font-size:10px;color:var(--text-muted);margin-top:4px;font-family:var(--mono);}
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(99,179,237,0.2);border-radius:3px;}
    @media(max-width:1200px){
      .stat-row.cols-4{grid-template-columns:repeat(2,1fr);}
      .stat-row.cols-5{grid-template-columns:repeat(3,1fr);}
      .chart-grid.cols-2,.chart-grid.cols-2-1{grid-template-columns:1fr;}
    }
    @media(max-width:768px){
      .page-content{padding:16px;}
      .stat-row.cols-4,.stat-row.cols-5{grid-template-columns:1fr 1fr;}
      .page-header{flex-direction:column;gap:16px;}
    }
  </style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const YEARS=[2018,2019,2020,2021,2022,2023,2024,2025];

const floodData={
  monthlyRainfall:[45,62,88,110,178,312,428,390,265,140,72,38],
  monthlyFloodRisk:[12,18,24,32,52,74,89,83,61,38,20,10],
  yearlyEvents:[14,19,22,18,28,35,41,52],
  yearlyAffected:[120,185,210,165,290,385,470,580],
  regionRisk:[
    {name:'Krishna Delta',risk:87,affected:12400,state:'Andhra Pradesh',level:'critical'},
    {name:'Brahmaputra Floodplain',risk:82,affected:28600,state:'Assam',level:'critical'},
    {name:'Bihar Plains',risk:76,affected:19200,state:'Bihar',level:'high'},
    {name:'Godavari Basin',risk:71,affected:9800,state:'Telangana',level:'high'},
    {name:'Mahanadi Delta',risk:68,affected:14300,state:'Odisha',level:'high'},
    {name:'Ganga Belt',risk:62,affected:31000,state:'Uttar Pradesh',level:'moderate'},
    {name:'Cauvery Delta',risk:48,affected:6700,state:'Tamil Nadu',level:'moderate'},
    {name:'Narmada Basin',risk:39,affected:4200,state:'Madhya Pradesh',level:'low'},
  ],
  shapFeatures:[
    {name:'Rainfall (72h cumulative)',val:0.42,color:'rgba(56,189,248,0.8)'},
    {name:'Soil Moisture Index',val:0.23,color:'rgba(20,184,166,0.8)'},
    {name:'River Gauge Level',val:0.18,color:'rgba(59,130,246,0.8)'},
    {name:'Topographic Slope',val:0.10,color:'rgba(99,102,241,0.8)'},
    {name:'Upstream Dam Level',val:0.07,color:'rgba(168,85,247,0.8)'},
  ],
  gaugeReadings:Array.from({length:30},(_,i)=>({
    krishna:parseFloat((8.2+Math.sin(i/4)*2.1+(i>18&&i<26?3.5:0)+Math.random()*0.4).toFixed(2)),
    brahmaputra:parseFloat((12.4+Math.sin(i/5)*3.5+(i>12&&i<20?4.2:0)+Math.random()*0.5).toFixed(2)),
  })),
  forecast48h:Array.from({length:49},(_,i)=>({
    risk:parseFloat(Math.min(100,45+Math.sin(i/8)*20+(i>20&&i<36?25:0)+Math.random()*8).toFixed(1)),
    lower:parseFloat(Math.max(0,35+Math.sin(i/8)*15+(i>20&&i<36?18:0)).toFixed(1)),
    upper:parseFloat(Math.min(100,55+Math.sin(i/8)*25+(i>20&&i<36?32:0)+Math.random()*10).toFixed(1)),
  })),
};

const stormData={
  monthlyFreq:[0.2,0.1,0.2,0.5,1.2,0.6,0.4,0.3,0.8,2.1,2.8,1.1],
  yearlyIntensity:YEARS.map(()=>({
    cat1:Math.floor(2+Math.random()*3),cat2:Math.floor(1+Math.random()*3),
    cat3:Math.floor(Math.random()*2),cat4:Math.floor(Math.random()*2),cat5:Math.floor(Math.random()*1.2)
  })),
  historicStorms:[
    {name:'Cyclone Amphan',year:2020,maxWind:185,pressure:920,deaths:128,damage:13200,cat:'Super Cyclone',landfall:'West Bengal'},
    {name:'Cyclone Biparjoy',year:2023,maxWind:150,pressure:944,deaths:14,damage:3600,cat:'Extremely Severe',landfall:'Gujarat'},
    {name:'Cyclone Mocha',year:2023,maxWind:195,pressure:924,deaths:463,damage:8100,cat:'Super Cyclone',landfall:'Myanmar/Bangladesh'},
    {name:'Cyclone Fani',year:2019,maxWind:180,pressure:932,deaths:89,damage:8100,cat:'Extremely Severe',landfall:'Odisha'},
    {name:'Cyclone Tauktae',year:2021,maxWind:165,pressure:940,deaths:198,damage:6900,cat:'Extremely Severe',landfall:'Gujarat'},
    {name:'Cyclone Gaja',year:2018,maxWind:120,pressure:976,deaths:63,damage:2800,cat:'Very Severe',landfall:'Tamil Nadu'},
  ],
  activeTrack:Array.from({length:72},(_,i)=>({
    hour:-72+i,
    windSpeed:parseFloat(Math.max(20,60+(i<36?i*3.2:(72-i)*2.8)+Math.sin(i/6)*12+Math.random()*8).toFixed(1)),
    pressure:parseFloat(Math.max(880,1010-(i<36?i*3.2:(72-i)*2.6)-Math.sin(i/6)*8-Math.random()*6).toFixed(0)),
  })),
  shapFeatures:[
    {name:'Wind Speed (10m)',val:0.50,color:'rgba(168,85,247,0.8)'},
    {name:'Pressure Gradient',val:0.30,color:'rgba(192,132,252,0.8)'},
    {name:'Sea Surface Temp',val:0.20,color:'rgba(99,179,237,0.8)'},
    {name:'Humidity (850 hPa)',val:0.14,color:'rgba(56,189,248,0.8)'},
    {name:'Distance to Coast',val:0.09,color:'rgba(59,130,246,0.8)'},
  ],
  regionRisk:[
    {name:'Bay of Bengal (North)',risk:82,level:'critical'},
    {name:'Arabian Sea (East)',risk:61,level:'high'},
    {name:'Bay of Bengal (South)',risk:58,level:'high'},
    {name:'Arabian Sea (West)',risk:42,level:'moderate'},
    {name:'Bay of Bengal (Central)',risk:38,level:'moderate'},
  ],
  forecastTrack:Array.from({length:13},(_,i)=>({t:i*6,wind:parseFloat(Math.max(60,120+i*5.5-Math.max(0,(i-8)*12)).toFixed(0))})),
};

const chartDef={
  plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(8,12,24,0.97)',borderColor:'rgba(99,179,237,0.35)',borderWidth:1,titleColor:'#e8f0fe',bodyColor:'#8ba3c7',padding:10,cornerRadius:8}},
  scales:{
    x:{grid:{color:'rgba(99,179,237,0.06)',drawBorder:false},ticks:{color:'#4a6080',font:{family:'JetBrains Mono',size:10}}},
    y:{grid:{color:'rgba(99,179,237,0.06)',drawBorder:false},ticks:{color:'#4a6080',font:{family:'JetBrains Mono',size:10}}}
  },
  animation:{duration:700},responsive:true,maintainAspectRatio:false,
};

function StatCard({label,value,sub,trend,trendType='neutral',icon,colorClass='blue'}){
  return React.createElement('div',{className:`stat-card ${colorClass}`},
    icon&&React.createElement('div',{className:'stat-icon'},icon),
    React.createElement('div',{className:'stat-label'},label),
    React.createElement('div',{className:'stat-value'},value),
    React.createElement('div',{className:'stat-sub'},sub,trend&&React.createElement('span',{className:`stat-trend ${trendType}`},trend))
  );
}
function RiskBadge({level}){return React.createElement('span',{className:`risk-badge ${level}`},level);}
function MiniBar({value,color}){
  return React.createElement('div',{className:'mini-bar'},React.createElement('div',{className:'mini-bar-fill',style:{width:`${value}%`,background:color}}));
}
function SHAP({features}){
  return React.createElement('div',null,features.map((f,i)=>
    React.createElement('div',{key:i,className:'feature-row'},
      React.createElement('div',{className:'feature-name'},f.name),
      React.createElement('div',{className:'feature-bar-bg'},React.createElement('div',{className:'feature-bar-fill',style:{width:`${f.val*100}%`,background:f.color}})),
      React.createElement('div',{className:'feature-pct'},`${(f.val*100).toFixed(0)}%`)
    )
  ));
}

function useChart(ref,configFn,deps){
  const chart=useRef(null);
  useEffect(()=>{
    if(chart.current){chart.current.destroy();chart.current=null;}
    if(ref.current){
      const cfg=configFn();

function App(){
  const validPages=['overview','flood','storm'];
  function getPageFromHash(){
    const h=window.location.hash.replace('#','');
    return validPages.includes(h)?h:'overview';
  }
  const[page,setPage]=useState(getPageFromHash);

  // Keep hash in sync when tab changes
  function goTo(id){
    setPage(id);
    history.replaceState(null,'','#'+id);
  }

  // React to back/forward or external hash changes
  useEffect(()=>{
    function onHash(){setPage(getPageFromHash());}
    window.addEventListener('hashchange',onHash);
    return()=>window.removeEventListener('hashchange',onHash);
  },[]);

  const dashTabs=[{id:'overview',label:'🌍 Overview',cls:''},{id:'flood',label:'🌊 Flood Dashboard',cls:'flood'},{id:'storm',label:'🌀 Storm Dashboard',cls:'storm'}];
  return React.createElement('div',{id:'app'},
    React.createElement('nav',{className:'topnav'},
      // Brand logo (non-clickable)
      React.createElement('div',{className:'nav-logo',style:{cursor:'default'}},
        React.createElement('div',{className:'nav-logo-icon'},'🌊'),
        React.createElement('div',null,
          React.createElement('div',{className:'nav-logo-text'},'FloodSense AI'),
          React.createElement('div',{className:'nav-logo-sub'},'Multi-Hazard Intelligence')
        )
      ),
      React.createElement('div',{className:'nav-divider'}),
      React.createElement('div',{className:'nav-tabs'},
        // Globe as first tab — hard link to index.html
        React.createElement('a',{href:'index.html',className:'nav-tab globe',title:'3D Globe — Real-time monitoring'},
          '🌐 Globe'
        ),
        React.createElement('div',{className:'nav-divider',style:{margin:'0 4px'}}),
        // Dashboard tabs
        dashTabs.map(t=>
          React.createElement('button',{key:t.id,className:`nav-tab ${t.cls} ${page===t.id?'active':''}`,onClick:()=>goTo(t.id)},t.label)
        )
      ),
      React.createElement('div',{className:'nav-spacer'}),
      React.createElement('div',{className:'nav-status'},React.createElement('div',{className:'status-dot'}),'Prediction Engine Online')
    ),
    React.createElement('main',{className:'page-content'},
      page==='overview'&&React.createElement(OverviewDashboard,null),
      page==='flood'&&React.createElement(FloodDashboard,null),
      page==='storm'&&React.createElement(StormDashboard,null)
    )
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(React.createElement(App,null));
